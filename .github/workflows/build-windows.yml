name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.7.0
          name: MedStatix Pro 1.7.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.7.0 – MedStatix Signature house style for every output: tables with an indigo header band, crimson rule, light zebra rows and significant p values highlighted, in the app and in Word (column widths fitted so numbers never wrap); Signature figure style and palette with neutral greys for control/sham/vehicle groups, crimson for the disease model and distinct cool hues for treatments. New Journal summary table (markers × groups, mean ± SD or median (IQR) with * versus control and # versus the disease model, each marker tested with the right ANOVA/Welch/Kruskal-Wallis procedure) with a matching multi-panel A/B/C figure, added automatically when Smart Analyze is run on several markers. Groups keep the order of the experimental design. Captions now state the exact test actually used (Welch ANOVA when variances differ), its statistic, df, p and effect size; correlation captions give r, 95% CI, p, r² and n, with the label placed away from the data. Windows installer (MedStatixPro-Setup-1.7.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
