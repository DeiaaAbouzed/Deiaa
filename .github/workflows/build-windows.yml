name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.3.1
          name: MedStatix Pro 1.3.1 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.3.1 – labels and arrows can be saved on the original (unenhanced) image or on the enhanced image (Export → Labels on). one-click publication-ready histology/IHC images (presets per stain and for camera or phone photos, automatic eyepiece crop, background whitening, flat-field, verified by the integrity check) with a before/after slider; batch processing of a whole folder straight to statistics; project files (.msx) with re-run on new data; target-journal presets (Elsevier, Springer, Nature, Wiley, PLOS, Cell Press, MDPI); manuscript builder (Statistical analysis + Results + APA tables + legends, Word); statistical report for reviewers (effect sizes with CI, sensitivity, robustness); multi-panel figures mixing charts and histology images; animal-study toolkit (randomisation, sample size, Grubbs/ROUT outliers, ARRIVE 2.0); pharmacology/toxicology study templates; English/Arabic interpretation export. Windows installer (MedStatixPro-Setup-1.3.1.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
