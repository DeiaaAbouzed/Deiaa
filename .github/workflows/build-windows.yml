name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v2.1.1
          name: MedStatix Pro 2.1.1 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 2.1.1 – Quick access to the newest tools on the toolbar, next to Recommendations: Full paper (Word + EndNote), Improve images (research images: quality, resolution, dpi), Pro comment (histopathology comment and legend), and a ✨ New tools menu that also holds the folder histopathology report, brush teaching of congestion and the Expert mode switch. Open/save, export, Settings and Language now sit on a second toolbar row, so nothing hides in the overflow. Includes everything in 2.1.0 (full-paper writer, PubMed, EndNote/RIS). Windows installer (MedStatixPro-Setup-2.1.1.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
