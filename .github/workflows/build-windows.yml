name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v2.0.0
          name: MedStatix Pro 2.0.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 2.0.0 – Expert mode (Settings, or the Research images tab): wider ranges for every histology/IHC adjustment, all tools allowed on blots and gels, enlargement up to x8 and a write-dpi-only option; every edit is still logged and disclosed in the methods. Professional histopathology comments: each AI reading gives a pathologist-style description with semi-quantitative grades (0-3, stated criteria) for inflammation, congestion and vacuolation, plus an editable figure legend in English and Arabic. Batch processing can run the AI reader on a whole study and writes histopathology_report.txt with per-image comments and a group comparison (Kruskal-Wallis, Mann-Whitney vs control, Holm). Windows installer (MedStatixPro-Setup-2.0.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
