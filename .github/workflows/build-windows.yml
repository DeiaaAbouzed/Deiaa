name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v2.1.0
          name: MedStatix Pro 2.1.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 2.1.0 – Write the full paper (Output menu, Ctrl+Shift+P): title, abstract, introduction, complete materials and methods, results, discussion, conclusion, declarations, tables, legends and figures in one Word file, built from your data, fixed academic templates and built-in knowledge of common pharmacology/toxicology markers (no AI text generation); what only the authors can write is left as highlighted prompts. In-app PubMed search, RIS import/export and EndNote temporary citations (Update Citations and Bibliography formats them in any journal style), or numbered/author-year reference lists. Expert-mode change now applies without restarting. Windows installer (MedStatixPro-Setup-2.1.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
