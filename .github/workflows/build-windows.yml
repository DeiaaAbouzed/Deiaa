name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.2.0
          name: MedStatix Pro 1.2.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.2.0 – Prism-style figure editor (plot type, colours per group, points, fonts, axes, full significance control: selected pairs, auto-stacked brackets, stars or exact p, ns toggle, GraphPad thresholds), automatic recommendations of the most suitable analyses after loading data, editable auto-captions with global Table/Figure numbering, export of every figure and image at 150–1200 dpi as TIFF/PNG/JPEG/PDF/SVG/EPS, and histology image inspection (10 quality checks with a 0–100 score) with one-click global auto-correction (flat-field, white balance, levels, gamma, saturation, denoise, sharpen) verified by the integrity check. Windows installer (MedStatixPro-Setup-1.2.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
