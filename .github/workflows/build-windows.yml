name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.8.0
          name: MedStatix Pro 1.8.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.8.0 – (1) One-click Results section: the Journal summary table now writes a complete, ready-to-paste Results section in English and Arabic for every marker (model vs control with fold/% change, each treatment vs the model with % recovery and whether control values were restored, dose comparison, and an overall best-treatment sentence), also in Word and the manuscript draft. (2) Congestion learned from your brush: paint red cells and look-alike tissue on ~10 images and a colour-plus-texture pixel classifier learns your stain; validated image by image and used only when it beats the colour rule, disclosed in the methods. (3) Faster teaching of the cell reader: lasso labelling (Shift+drag), suggestions of the most informative uncertain nuclei, tubular and glomerular labels, and refitting of the rodent inflammatory gate on your labels (activated only when better on held-out images). (4) Batch study colour reference: every image of a study is matched to one reference image (global Reinhard transform, drawn marks preserved, disclosed in the methods). Windows installer (MedStatixPro-Setup-1.8.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
