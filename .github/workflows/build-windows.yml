name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v2.3.0
          name: MedStatix Pro 2.3.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 2.3.0 – Reference library in the style of EndNote, plus Zotero. Search PubMed, Scopus (Elsevier API key), OpenAlex and Crossref from inside the library; Google Scholar exports are imported. Import/export RIS, EndNote .enw and XML, MEDLINE, BibTeX and Scopus CSV; import Zotero libraries with their collections. About 70 journal styles (CSL) bundled and 10,000+ downloadable. Format Word paper: temporary citations such as {Hassan, 2021 #12} become formatted citations and a reference list in the chosen journal style. The full-paper writer uses the same styles. Windows installer (MedStatixPro-Setup-2.3.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
