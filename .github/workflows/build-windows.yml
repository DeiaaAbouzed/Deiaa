name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.4.0
          name: MedStatix Pro 1.4.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.4.0 – AI image reader for histology and IHC: a deep-learning nucleus detector (StarDist versatile H&E, run offline with ONNX Runtime) and a nucleus-type network trained on CoNSeP (inflammatory F1 0.77 on held-out images) suggest inflammatory cells, inflammatory infiltrate foci, congestion and DAB-positive nuclei (per-cell H-score with thresholds set from the negative nuclei), each with a confidence; the user deletes wrong suggestions and accepts the rest, which adds labels and arrows automatically and sends the counts to statistics; a plain-language reading (English/Arabic) and a Methods paragraph with references go to the results/Word. Low-magnification images are enlarged for the network automatically. New Maximum enhancement level. Windows installer (MedStatixPro-Setup-1.4.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
