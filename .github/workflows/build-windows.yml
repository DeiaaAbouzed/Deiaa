name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.5.0
          name: MedStatix Pro 1.5.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.5.0 – Opens and saves SPSS (.sav, with value and variable labels) and GraphPad Prism (.pzfx) files; SPSS-style output tables (Settings); a Word validation report against R, SPSS-equivalent formulas, metafor, BayesFactor and G*Power (53 checks); Bayesian t-test, correlation and ANOVA (JZS Bayes factors); G*Power-style a priori, post hoc and sensitivity power analysis with the distribution plot; chart library (heatmap, volcano, radar, Kaplan–Meier, forest); automatic assumption checks that add the non-parametric test with an explanation; R bridge (verify the last analysis in R, R console); Photopea round trip with a check that only labels were added; duplicate / re-used image and copy-move detector; offline Arabic/English analysis assistant; teach the AI reader on your own slides (label nuclei, fine-tune with grouped cross-validation); in-app update. Windows installer (MedStatixPro-Setup-1.5.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
