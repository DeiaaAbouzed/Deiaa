name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v2.2.0
          name: MedStatix Pro 2.2.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 2.2.0 – Full paper, much improved. Optional Claude writing (your Anthropic API key): Claude writes the Abstract, Highlights, Introduction, Results text, Discussion and Conclusion from your data and references only; numbers not in your data are flagged [check: …], citations come only from your reference list, the Methods stay as built from the data, and an AI-use declaration is added. Automatic PubMed references when your list is short, and a reference list is always written (provisional list in EndNote mode). Template fixes: one Results section from the summary table instead of one per test, per-test tables moved to Supplementary material, a single statistics paragraph, correct number of groups in the Abstract, marker-specific Discussion text, bar charts of medians now show the IQR, no duplicate * / # reference group in legends. Windows installer (MedStatixPro-Setup-2.2.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
