name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.9.0
          name: MedStatix Pro 1.9.0 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.9.0 – New Research images studio for every figure that is not a histology slide: photographs (animals, organs, specimens), Western blots and gels, graphs and screenshots, scanned pages and fluorescence images. Automatic type detection and a one-click recipe per type (blots get linear-only changes, never clipped), fine global adjustments, automatic straightening and border removal, before/after comparison and quality metrics. Print sizing by journal column width and dpi (300/600/1000/1200) with a readiness report, faithful enlargement (Lanczos + iterative back-projection, no AI-invented detail, max x4) and honest dpi metadata; TIFF/PNG/JPEG/PDF in RGB, greyscale or CMYK; whole-folder processing with edit logs and a methods paragraph. Windows installer (MedStatixPro-Setup-1.9.0.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
