name: Build Windows installer

on:
  push:
    branches: ["medstatix-pro"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Validation suite
        run: python -m pytest tests -q
      - name: Build executable
        run: pyinstaller build/medstatix.spec --noconfirm --distpath dist --workpath build/work
      - name: Self-test frozen app (imaging + statistics)
        run: |
          $p = Start-Process -FilePath dist\MedStatixPro\MedStatixPro.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed"; exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
      - name: Zip portable version
        run: Compress-Archive -Path dist\MedStatixPro\* -DestinationPath dist\MedStatixPro-portable-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MedStatixPro-Windows
          path: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medstatix-v1.6.1
          name: MedStatix Pro 1.6.1 (Windows)
          target_commitish: ${{ github.sha }}
          body: "MedStatix Pro 1.6.1 – New scale-bar tool: pixel size from a saved calibration per objective (4×–100×) or read from the bar already on the image; automatic round length; position, black/white style with or without a box, text and bar size; editable and exported with the figure. Batch processing adds a calibrated scale bar to every saved image (never a second one when a bar is already there). Opening an image that carries a scale bar fills the pixel size automatically. Also in 1.6: AI image reader for rodent tissue: automatic calibration from the scale bar drawn on the figure (µm per pixel read from the bar and its label) and detection at the model's working resolution; arrows, arrowheads, stars, letters and the scale-bar box are ignored by every measurement; tissue profiles (rat/mouse kidney, other rodent tissue, human) with a calibrated inflammatory-cell filter trained on rat kidney and skeletal-muscle H&E (held-out AUC 0.86 vs 0.81; false positives in normal muscle cut from ~690 to ~2 per mm²); glomerulus recognition in kidney (tuft and Bowman's space areas, glomerular nuclei excluded from inflammatory cells); one-click enhancement keeps drawn arrows and the white scale-bar box unchanged; smart advisor analyses histopathological lesion scores with Kruskal-Wallis/Dunn (median, IQR) and uses Welch ANOVA with Games-Howell when variances differ. Windows installer (MedStatixPro-Setup-1.6.1.exe) and portable ZIP."
          files: |
            dist/installer/*.exe
            dist/MedStatixPro-portable-win64.zip
